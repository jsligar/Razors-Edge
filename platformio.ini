; Common configuration for all environments
[env]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
    adafruit/Adafruit SSD1306@^2.5.7
    adafruit/Adafruit GFX Library@^1.11.5
    adafruit/Adafruit PWM Servo Driver Library@^2.4.1
    adafruit/Adafruit INA228 Library@^3.0.0
    mikalhart/TinyGPSPlus@^1.0.3
    bblanchon/ArduinoJson@^6.21.3
    links2004/WebSockets@^2.4.1
    wire
upload_speed = 921600
board_build.filesystem = littlefs

; Production/Release build (optimized for size and performance)
[env:release]
build_flags =
    -DCORE_DEBUG_LEVEL=1
    -DLOG_LEVEL=LOG_LEVEL_INFO
    -DNDEBUG
    -O2
    -DVERSION_MAJOR=1
    -DVERSION_MINOR=1
    -DVERSION_PATCH=0

; Debug build (full logging, assertions enabled)
[env:debug]
build_flags =
    -DCORE_DEBUG_LEVEL=5
    -DCONFIG_ARDUHAL_LOG_COLORS=1
    -DLOG_LEVEL=LOG_LEVEL_DEBUG
    -DDEBUG
    -Og
    -g
    -DVERSION_MAJOR=1
    -DVERSION_MINOR=1
    -DVERSION_PATCH=0

; Default development build
[env:esp32dev]
build_flags =
    -DCORE_DEBUG_LEVEL=3
    -DCONFIG_ARDUHAL_LOG_COLORS=1
    -DLOG_LEVEL=LOG_LEVEL_INFO
    -O1
    -DVERSION_MAJOR=1
    -DVERSION_MINOR=1
    -DVERSION_PATCH=0

; Native testing environment (runs on host PC)
[env:native]
platform = native
test_framework = unity
build_flags =
    -DUNIT_TEST
    -std=c++11

; Hardware-in-the-loop testing
[env:test]
test_framework = unity
test_build_src = yes
build_flags =
    -DCORE_DEBUG_LEVEL=5
    -DUNIT_TEST
    -DLOG_LEVEL=LOG_LEVEL_DEBUG
    -O0
    -g

; I2C Scanner utility
[env:i2c_scanner]
build_src_filter = +<../i2c_scanner.cpp>
build_flags =
    -DCORE_DEBUG_LEVEL=3
    -O1

; PCA9685 Light Test
[env:light_test]
build_src_filter = +<../test_pca9685_lights.cpp>
build_flags =
    -DCORE_DEBUG_LEVEL=3
    -O1
