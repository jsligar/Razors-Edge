name: PlatformIO CI/CD

on:
  push:
    branches: [ main, develop, 'claude/**' ]
  pull_request:
    branches: [ main, develop ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        environment: [esp32dev, debug, release]

    steps:
    - name: Checkout code
      uses: actions/checkout@v3
      with:
        fetch-depth: 0  # Fetch all history for version tagging

    - name: Cache PlatformIO
      uses: actions/cache@v3
      with:
        path: |
          ~/.platformio
          .pio
        key: ${{ runner.os }}-pio-${{ hashFiles('**/platformio.ini') }}
        restore-keys: |
          ${{ runner.os }}-pio-

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.x'

    - name: Install PlatformIO
      run: |
        python -m pip install --upgrade pip
        pip install platformio

    - name: Get build number
      id: buildnumber
      run: |
        BUILD_NUM=$(git rev-list --count HEAD)
        echo "BUILD_NUMBER=$BUILD_NUM" >> $GITHUB_OUTPUT
        echo "Build number: $BUILD_NUM"

    - name: Get git commit hash
      id: commit
      run: |
        COMMIT_HASH=$(git rev-parse --short HEAD)
        echo "COMMIT_HASH=$COMMIT_HASH" >> $GITHUB_OUTPUT
        echo "Commit hash: $COMMIT_HASH"

    - name: Build firmware (${{ matrix.environment }})
      run: |
        pio run -e ${{ matrix.environment }} \
          --build-flag="-DBUILD_NUMBER=${{ steps.buildnumber.outputs.BUILD_NUMBER }}" \
          --build-flag="-DGIT_COMMIT_HASH=\\\"${{ steps.commit.outputs.COMMIT_HASH }}\\\""

    - name: Upload firmware artifacts
      if: matrix.environment == 'release'
      uses: actions/upload-artifact@v3
      with:
        name: firmware-${{ matrix.environment }}-${{ steps.buildnumber.outputs.BUILD_NUMBER }}
        path: .pio/build/${{ matrix.environment }}/firmware.*
        retention-days: 30

  test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Cache PlatformIO
      uses: actions/cache@v3
      with:
        path: |
          ~/.platformio
          .pio
        key: ${{ runner.os }}-pio-test-${{ hashFiles('**/platformio.ini') }}
        restore-keys: |
          ${{ runner.os }}-pio-test-

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.x'

    - name: Install PlatformIO
      run: |
        python -m pip install --upgrade pip
        pip install platformio

    - name: Run tests
      run: |
        pio test -e test --verbose

    - name: Generate test report
      if: always()
      run: |
        echo "Test results available in PlatformIO output above"

  static-analysis:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.x'

    - name: Install PlatformIO
      run: |
        python -m pip install --upgrade pip
        pip install platformio

    - name: Run static analysis
      run: |
        pio check -e esp32dev --severity=medium --verbose || true

  code-quality:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Check code formatting
      run: |
        find src -name "*.cpp" -o -name "*.h" | wc -l
        echo "Code formatting check placeholder"

    - name: Check for common issues
      run: |
        echo "Checking for TODO/FIXME comments..."
        grep -r "TODO\|FIXME\|XXX\|HACK" src/ --include="*.cpp" --include="*.h" || echo "No issues found"

  release:
    runs-on: ubuntu-latest
    needs: [build-and-test, test]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.x'

    - name: Install PlatformIO
      run: |
        python -m pip install --upgrade pip
        pip install platformio

    - name: Get version info
      id: version
      run: |
        VERSION=$(grep "VERSION_MAJOR" src/Version.h | cut -d' ' -f3)
        echo "VERSION=$VERSION" >> $GITHUB_OUTPUT

    - name: Build release firmware
      run: |
        BUILD_NUM=$(git rev-list --count HEAD)
        COMMIT_HASH=$(git rev-parse --short HEAD)
        pio run -e release \
          --build-flag="-DBUILD_NUMBER=$BUILD_NUM" \
          --build-flag="-DGIT_COMMIT_HASH=\\\"$COMMIT_HASH\\\""

    - name: Create release notes
      run: |
        echo "# Razors Edge Firmware Release" > release_notes.md
        echo "" >> release_notes.md
        echo "**Version:** $(cat src/Version.h | grep VERSION_MAJOR | cut -d' ' -f3).$(cat src/Version.h | grep VERSION_MINOR | cut -d' ' -f3).$(cat src/Version.h | grep VERSION_PATCH | cut -d' ' -f3)" >> release_notes.md
        echo "**Build:** $(git rev-list --count HEAD)" >> release_notes.md
        echo "**Commit:** $(git rev-parse --short HEAD)" >> release_notes.md
        echo "" >> release_notes.md
        echo "## Changes" >> release_notes.md
        git log --oneline -10 >> release_notes.md

    - name: Upload release artifacts
      uses: actions/upload-artifact@v3
      with:
        name: release-firmware
        path: |
          .pio/build/release/firmware.*
          release_notes.md
        retention-days: 90
